# Volume overlay for the PiBoy DMG, in the spirit of the bar Experimental Pi's
# dispmanx `osd` binary drew. Sized for the 640x480 DPI panel.
timeout = 1200
max = 100
width = 400
height = 32
border_offset = 4
border_size = 2
bar_padding = 3
anchor = bottom
margin = 48
background_color = 00000099
border_color = FFFFFFCC
bar_color = FFFFFFFF
