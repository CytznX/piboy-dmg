# PiBoy DMG - volume OSD, drawn by mako.
#
# Installed as /opt/retropie/configs/all/wayland/mako.ini and launched from
# startup.sh; see piboy-volume-osd.sh for what feeds it.
#
# mako replaced wob here because wob draws a bar and ONLY a bar - it has no
# text or icon support at any version - and this needs a speaker icon and a
# percentage beside it. Everything upstream of the renderer is unchanged:
# piboy-vold still publishes the wheel position to /run/piboy-volume.

# overlay, for the same reason waybar is: wlroots raises a fullscreen window
# above the `top` layer, so an OSD on `top` is invisible over a running game -
# which is the one moment it matters most.
layer=overlay

# Bottom centre, clear of waybar along the top edge. 640x480 panel, so this is
# a large fraction of the width on purpose: it is read at arm's length.
#
# OUTER-MARGIN, not margin. `margin` is the spacing applied to each individual
# notification, i.e. the gap BETWEEN them when several stack; it does not move
# the stack away from the output edge. Setting margin=0,0,120,0 changed nothing
# visible - the panel still sat on the bottom edge, over EmulationStation's help
# bar. `outer-margin` is the gap from the edge, and 120px on a 480px panel puts
# it a quarter of the way up: clear of the action, still obviously status.
anchor=bottom-center
width=300
height=70
margin=0
outer-margin=0,0,120,0
padding=10

# Matches waybar.css - black at ~65% over white monospace - so the two pieces of
# on-screen furniture look like they belong to the same device.
background-color=#000000A6
text-color=#FFFFFF
border-size=0
border-radius=8
font=monospace 18

# THE BAR. mako fills the popup to the `value` hint that piboy-volume-osd.sh
# sends, so the notification IS the level bar; `over` keeps the icon and the
# percentage legible on top of the fill rather than being replaced by it.
progress-color=over #3584E4B3

# The icon. The feeder passes an ABSOLUTE PATH to our own recoloured copies
# (see mkvolumeicons.sh), so no icon-path/theme lookup is involved - mako's
# icon-path only approximates the XDG spec and carries no theme metadata.
icons=1
icon-location=left
max-icon-size=32

# Summary only: the feeder sends the percentage as the summary, so this renders
# as "<icon> 35%" and nothing else. The default format adds a bold title and a
# body line, which would be two mostly-empty rows on a screen this size.
format=%s
text-alignment=left

# A glance, not a message. The feeder replaces the live notification by id
# rather than posting a new one per wheel step, so these never stack, but cap
# it anyway - a stray notification from anything else must not push the volume
# OSD into a second row over a game.
default-timeout=1500
max-visible=1
