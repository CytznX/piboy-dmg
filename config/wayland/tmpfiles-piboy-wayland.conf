f /var/log/piboy-wayland.log 0644 cytzenx cytzenx -

# /run is tmpfs and root-owned 0755, so this file vanishes every boot and the
# session scripts - which run as cytzenx - cannot recreate it. piboy-vold only
# creates it when the wheel is first TURNED (its startup seed applies the volume
# deliberately without publishing), so without this line piboy-volume-osd.sh
# finds nothing to watch at compositor start and the volume bar is dead for the
# whole session. Root owns it because piboy-vold writes it; the OSD only reads.
f /run/piboy-volume 0644 root root -
